<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Dimas.</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2>Hubungi Saya</h2>
            <p>Silakan isi formulir di bawah ini untuk kolaborasi atau pertanyaan terkait infrastruktur jaringan.</p>
            
            <form action="#" method="POST" class="contact-form">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>

                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>

                <label for="kategori">Kategori / Keperluan</label>
                <select id="kategori" name="kategori" required>
                    <option value="" disabled selected>Pilih Keperluan...</option>
                    <option value="konsultasi">Konsultasi Jaringan / Server</option>
                    <option value="kolaborasi">Kolaborasi Proyek</option>
                    <option value="umum">Pertanyaan Umum</option>
                </select>

                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea>

                <button type="submit" class="btn-submit">Kirim Pesan</button>
            </form>
        </section>
    </main>
</body>
</html>
