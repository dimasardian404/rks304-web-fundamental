<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>belajartailwind.com - Dashboard</title>
    <!-- Memanggil Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex flex-col bg-gray-50 text-gray-800 font-sans">
    <!-- 2. Navigation Header Biru & 1. Logo Teks Putih -->
    <header
      class="bg-blue-600 text-white flex justify-between items-center px-6 py-4 shadow-md"
    >
      <div class="text-xl font-bold tracking-wide">belajartailwind.com</div>
      <a
        class="bg-blue-800 hover:bg-red-900 px-4 py-2 rounded-md font-semibold transition text-sm"
        href="index.html"
      >
        Logout
      </a>
    </header>

    <!-- Wrapper untuk Sidebar & Konten Utama -->
    <div class="flex flex-1 overflow-hidden">
      <!-- 3. Sidebar Kiri -->
      <aside class="w-64 bg-white border-r shadow-lg flex flex-col p-4">
        <nav class="flex flex-col gap-2">
          <!-- Status Aktif (Diklik): Background Biru, Teks Putih -->
          <a
            href="dashboard.html"
            class="px-4 py-3 rounded-lg text-black hover:bg-gray-100 font-medium transition"
          >
            Dashboard
          </a>
          <!-- Status Inaktif: Teks Hitam -->
          <a
            href="products.html"
            class="px-4 py-3 rounded-lg bg-sky-400 text-white font-medium shadow transition"
          >
            Products
          </a>
          <a
            href="#"
            class="px-4 py-3 rounded-lg text-black hover:bg-gray-100 font-medium transition"
          >
            Users
          </a>
          <a
            href="#"
            class="px-4 py-3 rounded-lg text-black hover:bg-gray-100 font-medium transition"
          >
            Settings
          </a>
        </nav>
      </aside>

      <!-- 4. Area Konten Utama -->
      <main class="flex-1 p-8 overflow-y-auto">
        <h1 class="text-3xl font-bold mb-4 text-gray-900">Manajemen Produk</h1>
        <hr class="my-4 border-gray-50" />
        <a
          class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mb-4"
          href="add-product.html"
        >
          Add Product
        </a>
        <hr class="my-4 border-gray-50" />
        <div
          class="overflow-x-auto bg-white rounded-lg shadow-sm border border-gray-200"
        >
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase tracking-wider"
              >
                <th class="px-6 py-4 font-medium">No</th>
                <th class="px-6 py-4 font-medium">Name</th>
                <th class="px-6 py-4 font-medium">Stock</th>
                <th class="px-6 py-4 font-medium">Description</th>
                <th class="px-6 py-4 font-medium">Action</th>
              </tr>
            </thead>
            <tbody class="text-gray-700 text-sm divide-y divide-gray-100">
              <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-6 py-4 font-medium text-gray-900">1</td>
                <td class="px-6 py-4 font-medium text-gray-900">Beng-Beng</td>
                <td class="px-6 py-4 font-medium text-gray-900">25</td>
                <td class="px-6 py-4 font-medium text-gray-900">
                  Chocolate Wafer
                </td>
                <td class="px-6 py-4">
                  <div class="flex gap-2">
                    <a
                      href="edit-product.html"
                      class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-medium py-1.5 px-3 rounded-md transition"
                    >
                      Edit
                    </a>

                    <a
                      href="#"
                      class="bg-red-50 hover:bg-red-100 text-red-600 font-medium py-1.5 px-3 rounded-md transition"
                    >
                      Delete
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- 6. Footer -->
    <footer class="bg-gray-800 text-white text-center py-2 text-sm">
      &copy; 2026 belajartailwind.com. Hak cipta dilindungi undang-undang.
    </footer>
  </body>
</html>
