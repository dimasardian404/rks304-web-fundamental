<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login System</title>
    <!-- Memanggil Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <!-- min-h-screen & flex digunakan untuk menengahkan form di tengah layar vertikal dan horizontal -->
  <body
    class="bg-gray-50 flex items-center justify-center min-h-screen font-sans"
  >
    <!-- Header dipindah ke atas dengan absolute dan di-center -->
    <header
      class="absolute top-0 w-full bg-blue-600 text-white flex justify-center items-center py-4 shadow-md"
    >
      <div class="text-xl font-bold tracking-wide">belajartailwind.com</div>
    </header>

    <!-- Kotak Form Login -->
    <div
      class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm border border-gray-100 mt-16"
    >
      <!-- Header Login -->
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-900">Selamat Datang</h1>
        <p class="text-sm text-gray-500 mt-2">Silakan masuk ke akun Anda</p>
      </div>

      <!-- Form -->
      <form action="#" method="POST" class="flex flex-col gap-5">
        <!-- Input Username -->
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 mb-1.5"
            >Username</label
          >
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Masukkan username"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          />
        </div>

        <!-- Input Password -->
        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1.5"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
          />
        </div>

        <!-- Opsi Tambahan (Ingat Saya & Lupa Sandi) -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-600 cursor-pointer">
            <input
              type="checkbox"
              class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
            />
            Ingat saya
          </label>
          <a
            href="#"
            class="text-blue-600 hover:text-blue-700 hover:underline font-medium"
            >Lupa sandi?</a
          >
        </div>

        <!-- Tombol Login -->
        <a
          href="dashboard.html"
          class="mt-4 w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition-colors focus:outline-none focus:ring-4 focus:ring-blue-500/50 text-center block"
        >
          Login
        </a>
      </form>
    </div>
  </body>
</html>
